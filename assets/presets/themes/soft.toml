schema_version = 1
name = "Soft"
description = "Rounded, quiet surfaces with gentle shadows and slow eased transitions."
author = "HyprStudio"

[appearance]
rounding = 18
border_size = 0
active_border = "rgba(92929aff)"
inactive_border = "rgba(29292fff)"
opacity = 0.98
inactive_opacity = 0.95
shadow_enabled = true
shadow_range = 18
shadow_render_power = 4
shadow_color = "rgba(00000066)"
blur_enabled = true
blur_size = 8
blur_passes = 2
blur_noise = 0.01
gaps_in = 6
gaps_out = 12

[animations]
enabled = true

[[animations.curves]]
name = "hs_smooth"
type = "bezier"
x1 = 0.25
y1 = 0.1
x2 = 0.25
y2 = 1.0

[[animations.rules]]
leaf = "windows"
enabled = true
speed = 6.0
curve = "hs_smooth"
style = "slide"

[[animations.rules]]
leaf = "workspaces"
enabled = true
speed = 7.0
curve = "hs_smooth"
style = "slidefade 20%"

[[animations.rules]]
leaf = "fade"
enabled = true
speed = 5.0
curve = "hs_smooth"

[[animations.rules]]
leaf = "layers"
enabled = true
speed = 5.0
curve = "hs_smooth"
style = "fade"
