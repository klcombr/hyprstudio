[package]
name = "hyprstudio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "HyprStudio — visual desktop customization suite for Hyprland"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.33", features = ["bundled"] }
similar = "2.6"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gtk4 = { version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
