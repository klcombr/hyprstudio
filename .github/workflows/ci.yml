name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libadwaita-1
      - name: Run tests
        env:
          HYPRSTUDIO_SKIP_HYPRLAND_VERIFY: 1
        run: cargo test --locked
